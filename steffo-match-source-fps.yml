      preset: medium
      maxrate: 1500k
      bufsize: 3000k
      fps_mode: cfr
      crf: 21
      pix_fmt: yuv420p
      force_key_frames: #{profileParams['keyframes']?:'expr:gte(t,n_forced*3.84)'}
      profile:v: main
      write_tmcd: 0
    x264-params:
      keyint: 384
      keyint_min: 96
      ref: 4
    audioEncode:
      optional: true
      type: AudioEncode
      codec: aac
      bitrate: 128k
      suffix: STEREO
      channelLayout: stereo
      audioMixPreset: #{profileParams['audioMixPreset']?:'stereoFromMono12'}

  - type: X264Encode
    suffix: _800_360p
    twoPass: false
    height: 360
