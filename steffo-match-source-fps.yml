name: steffo-match-source-fps
description: Program HD profile, single pass. Output frame rate follows the input, constant (CFR).
scaling: bicubic

encodes:
  - type: X264Encode
    suffix: _6500_1080p
    twoPass: false
    height: 1080
    params:
      preset: medium
      maxrate: 6500k
      bufsize: 13000k
      fps_mode: cfr
      crf: 21
      pix_fmt: yuv420p
      force_key_frames: #{profileParams['keyframes']?:'expr:gte(t,n_forced*3.84)'}
      profile:v: high
      write_tmcd: 0
    x264-params:
      keyint: 384
      keyint_min: 96
      ref: 4
    audioEncode:
      optional: true
      type: AudioEncode
      codec: aac
      bitrate: 128k
      suffix: STEREO
      channelLayout: stereo
      audioMixPreset: #{profileParams['audioMixPreset']?:'stereoFromMono12'}

  - type: X264Encode
    suffix: _4000_720p
    twoPass: false
    height: 720
    params:
      preset: medium
      maxrate: 4000k
      bufsize: 8000k
      fps_mode: cfr
      crf: 21
      pix_fmt: yuv420p
      force_key_frames: #{profileParams['keyframes']?:'expr:gte(t,n_forced*3.84)'}
      profile:v: high
      write_tmcd: 0
    x264-params:
      keyint: 384
      keyint_min: 96
      ref: 4
    audioEncode:
      optional: true
      type: AudioEncode
      codec: aac
      bitrate: 128k
      suffix: STEREO
      channelLayout: stereo
      audioMixPreset: #{profileParams['audioMixPreset']?:'stereoFromMono12'}

  - type: X264Encode
    suffix: _2500_576p
    twoPass: false
    height: 576
    params:
      preset: medium
      maxrate: 2500k
      bufsize: 5000k
      fps_mode: cfr
      crf: 21
      pix_fmt: yuv420p
      force_key_frames: #{profileParams['keyframes']?:'expr:gte(t,n_forced*3.84)'}
      profile:v: main
      write_tmcd: 0
    x264-params:
      keyint: 384
      keyint_min: 96
      ref: 4
    audioEncode:
      optional: true
      type: AudioEncode
      codec: aac
      bitrate: 128k
      suffix: STEREO
      channelLayout: stereo
      audioMixPreset: #{profileParams['audioMixPreset']?:'stereoFromMono12'}

  - type: X264Encode
    suffix: _1500_432p
    twoPass: false
