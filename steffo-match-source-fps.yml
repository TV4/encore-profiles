      write_tmcd: 0
    x264-params:
      keyint: 384
      keyint_min: 96
      ref: 4
    audioEncode:
      optional: true
      type: AudioEncode
      codec: aac
      bitrate: 64k
      suffix: STEREO
      channelLayout: stereo
      audioMixPreset: #{profileParams['audioMixPreset']?:'stereoFromMono12'}

  - type: AudioEncode
    optional: true
    codec: aac
    bitrate: 128k
    suffix: _STEREO
    channelLayout: stereo
    audioMixPreset: #{profileParams['audioMixPreset']?:'stereoFromMono12'}
