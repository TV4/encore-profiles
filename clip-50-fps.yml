name: clip-50-fps
description: Profile for 50fps clips; 720p and 576p at 50fps, lower rungs at 25fps
scaling: bicubic # lanczos might e better, but has a performance impact
encodes:
  - type: X264Encode
    suffix: _x264_720_50
    twoPass: false # Might want 2-pass, we'll see
    height: 720
    width: 1280
    params:
      shortest: ""
      b:v: 3500k
      maxrate: 5250k
      bufsize: 7000k
      r: 50
      fps_mode: cfr
      pix_fmt: yuv420p
      tag:v: avc1
      force_key_frames: "expr:not(mod(n,192))" # 3.84 s, same grid as the 25 fps rungs
      profile:v: high
      level: 3.2
      preset: faster
    x264-params:
      deblock: 0,0
      aq-mode: 1
      aq-strength: 1.0
      keyint: 192
      keyint_min: 96
      cabac: 1
      # Tag only: ffmpeg's -colorspace etc. made every scaler convert untagged
      # sources from BT.601, costing ~25% CPU and shifting colours.
      colorprim: bt709
      transfer: bt709
      colormatrix: bt709
    audioEncode:
      filters:
        - apad=packet_size=1
      optional: true
      type: AudioEncode
      codec: aac
      bitrate: 128k
      suffix: STEREO
  - type: X264Encode
    suffix: _x264_576_50
    twoPass: false # Might want 2-pass, we'll see
    height: 576
    width: 1024
    params:
      shortest: ""
      b:v: 3000k
      maxrate: 4500k
      bufsize: 6000k
      r: 50
      fps_mode: cfr
      pix_fmt: yuv420p
      tag:v: avc1
      force_key_frames: "expr:not(mod(n,192))"
      profile:v: high
      level: 3.2
      preset: veryfast
    x264-params:
      deblock: 0,0
      aq-mode: 1
      aq-strength: 1.0
      keyint: 192
      keyint_min: 96
      cabac: 1
      colorprim: bt709
      transfer: bt709
      colormatrix: bt709
    audioEncode:
      filters:
        - apad=packet_size=1
      optional: true
      type: AudioEncode
      codec: aac
      bitrate: 128k
      suffix: STEREO
  - type: X264Encode
    suffix: _x264_432_25
    twoPass: false # Might want 2-pass, we'll see
    height: 432
    width: 768
    params:
      shortest: ""
      b:v: 1500k
      maxrate: 2250k
      bufsize: 3000k
      r: 25
      fps_mode: cfr
      pix_fmt: yuv420p
      tag:v: avc1
      force_key_frames: "expr:not(mod(n,96))"
      profile:v: main
      level: 3.0
      preset: veryfast
    x264-params:
      deblock: 0,0
      aq-mode: 1
      aq-strength: 1.0
      keyint: 192
      keyint_min: 96
      me: hex
      merange: 16
      cabac: 1
      colorprim: bt709
      transfer: bt709
      colormatrix: bt709
    audioEncode:
      filters:
        - apad=packet_size=1
      optional: true
      type: AudioEncode
      codec: aac
      bitrate: 128k
      suffix: STEREO
  - type: X264Encode
    suffix: _x264_360_25
    twoPass: false # Might want 2-pass, we'll see
    height: 360
    width: 640
    params:
      shortest: ""
      b:v: 800k
      maxrate: 1200k
      bufsize: 1600k
      r: 25
      fps_mode: cfr
      pix_fmt: yuv420p
      tag:v: avc1
      force_key_frames: "expr:not(mod(n,96))"
      profile:v: main
      level: 3.0
      preset: veryfast
    x264-params:
      deblock: 0,0
      aq-mode: 1
      aq-strength: 1.0
      keyint: 192
      keyint_min: 96
      me: hex
      merange: 16
      cabac: 1
      colorprim: bt709
      transfer: bt709
      colormatrix: bt709
    audioEncode:
      filters:
        - apad=packet_size=1
      optional: true
      type: AudioEncode
      codec: aac
      bitrate: 128k
      suffix: STEREO
  - type: X264Encode
    suffix: _x264_216_25
    twoPass: false # Might want 2-pass, we'll see
    height: 216
    width: 384
    params:
      shortest: ""
      b:v: 300k
      maxrate: 450k
      bufsize: 600k
      r: 25
      fps_mode: cfr
      pix_fmt: yuv420p
      tag:v: avc1
      force_key_frames: "expr:not(mod(n,96))"
      profile:v: main
      level: 1.3
      preset: veryfast
    x264-params:
      deblock: 0,0
      aq-mode: 1
      aq-strength: 1.0
      keyint: 192
      keyint_min: 96
      me: hex
      merange: 16
      cabac: 1
      colorprim: bt709
      transfer: bt709
      colormatrix: bt709
    audioEncode:
      filters:
        - apad=packet_size=1
      optional: true
